<style>
  body { background-color: #f3f4f6; color: #023047; }
  .glass-panel { background: rgba(254, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 143, 163, 0.2); }
  .btn-pink { background: linear-gradient(135deg, #ff8fa3 0%, #ff758f 100%); color: white; transition: all 0.3s ease; }
  .btn-pink:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 117, 143, 0.3); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #ff8fa3; }
  .view-section { display: none; animation: fadeIn 0.4s ease; }
  .view-section.active { display: block; }
  .emp-view-section { display: none; animation: fadeIn 0.3s ease; }
  .emp-view-section.active { display: block; }
  .blur-text { filter: blur(6px); user-select: none; transition: filter 0.3s ease; }
  .blur-text.unblurred { filter: blur(0); }
</style>
