<!-- File: Login.html -->
<div id="app-login" class="absolute inset-0 z-50 flex items-center justify-center bg-brandBg/80 backdrop-blur-md px-4">
  <div class="glass-panel p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
    <div class="w-20 h-20 rounded-full bg-brandPink mx-auto flex items-center justify-center text-white font-bold shadow-lg mb-4 text-3xl">
      <i class="fa-solid fa-spa"></i>
    </div>
    <h1 class="text-2xl font-bold text-brandText mb-1">Ara Beauty</h1>
    <p class="text-xs text-gray-500 mb-8">Portal Login Karyawan & Owner</p>
    
    <form id="formLogin" onsubmit="handleLogin(event)">
      <div class="mb-6 text-left">
        <label class="block mb-2 font-medium text-sm text-gray-600">PIN Akses (6 Digit)</label>
        <input type="password" id="loginPin" required maxlength="6" pattern="[0-9]{6}" placeholder="••••••" class="w-full border-2 border-gray-100 rounded-2xl px-5 py-3 outline-none focus:border-brandPink text-center text-2xl tracking-widest font-bold bg-white transition-all shadow-sm">
      </div>
      <button type="submit" class="w-full btn-pink py-3 rounded-2xl font-bold shadow-lg text-lg">Masuk</button>
    </form>
  </div>
</div>
